<main>

<section id="registro">

    <h3>Registro de usuario</h3>

    <form action="" method="post">

        <label>Documento</label>
        <input type="text" name="documento" required placeholder="Ingrese aqui su documento">

        <label>Nombre Completo</label>
        <input type="text" name="nombre" required placeholder="Ingrese aqui su nombre">

        <label for="correo">Correo Electrónico</label>
        <input type="email" name="correo" id="correo" required>

        <label for="fechaNac">Fecha Nac.</label>
        <input type="date" name="fechaNac" id="fechaNac" required>

        <label>Género</label>

        <div class="genero">

            <input type="radio" name="genero" value="Masculino"> Masculino
            <input type="radio" name="genero" value="Femenino"> Femenino
            <input type="radio" name="genero" value="Otro"> Otro

        </div>

        <label>Ciudades</label>

        <select>

            <option>Seleccione</option>
            <option value="medellin">Medellín</option>
            <option value="barranquilla">Barranquilla</option>
            <option value="cali">Cali</option>
            <option value="bogota">Bogotá</option>

        </select>

        <div class="terminos">

            <input type="checkbox">
            Acepto términos y condiciones.

        </div>

        <hr>

        <button type="submit">ENVIAR</button>

        <button type="reset">Limpiar</button>

    </form>

</section>
